server:
  port: 8082

spring:
  application:
    name: ai-auth-service

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_knowledge_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234

  data:
    redis:
      host: localhost
      port: 6379
      database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwtSecret: ASecretKeyForJWTThatIsLongEnoughToEnsureSecurityAndShouldBeStoredInEnvironmentVariables
  jwtExpirationInMs: 86400000 # 24 hours

logging:
  level:
    com.travlejava.ai: debug

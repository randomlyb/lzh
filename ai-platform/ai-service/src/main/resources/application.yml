server:
  port: ${AI_SERVER_PORT:8083}

spring:
  application:
    name: ai-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_knowledge_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  elasticsearch:
    uris: ${ES_URLS:http://localhost:9200}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.travlejava.ai: debug
    org.springframework.web: debug

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-ws-H.EPYXYLH.oiMb.MEQCIA_Ccdk9Ph4bg35fedSKkk6IUO6yAf9xI8dtbwiZgTFPAiAviHVwysxUfDbfinf6dBmmX6-UDivMfcXX70RCp7Fraw}
  base-url: ${DEEPSEEK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

app:
  upload-dir: ${UPLOAD_DIR:/tmp/ai-platform-uploads}